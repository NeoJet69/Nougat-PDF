org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
kotlin.code.style=official
android.useAndroidX=true
# Mettre a true pour ne construire que la version Windows/ordinateur,
# par exemple sur une machine sans SDK Android : ./gradlew -Pnougat.desktopOnly=true ...
nougat.desktopOnly=false
# Numero de la prochaine release (versionCode Android, version Windows 1.0.N) : +1 a chaque
# release, et seulement a ce moment-la. La 1.0.79 est sur Google Play.
nougat.versionCode=80
