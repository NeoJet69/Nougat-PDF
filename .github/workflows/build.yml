name: Construire Nougat PDF

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Publier une Release (APK + installateurs Windows)"
        type: boolean
        default: false

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Tests + APK Android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Clé de signature Android
        env:
          NOUGAT_KEYSTORE: ${{ secrets.NOUGAT_KEYSTORE }}
        run: |
          if [ -n "$NOUGAT_KEYSTORE" ]; then
            echo "$NOUGAT_KEYSTORE" | base64 --decode > "$RUNNER_TEMP/nougat.jks"
            echo "NOUGAT_KEYSTORE_FILE=$RUNNER_TEMP/nougat.jks" >> "$GITHUB_ENV"
            echo "APK signé avec la clé Nougat."
          else
            echo "::warning::Pas de clé NOUGAT_KEYSTORE : APK signé avec la clé de debug (voir README)."
          fi
      - name: APK Android
        env:
          NOUGAT_KEYSTORE_PASSWORD: ${{ secrets.NOUGAT_KEYSTORE_PASSWORD }}
          NOUGAT_KEY_ALIAS: ${{ secrets.NOUGAT_KEY_ALIAS }}
          NOUGAT_KEY_PASSWORD: ${{ secrets.NOUGAT_KEY_PASSWORD }}
        run: ./gradlew :androidApp:assembleRelease --console=plain
      # Google Play : l'AAB est signe avec la cle d'envoi (upload key), seulement si elle est
      # dans les secrets (NOUGAT_UPLOAD_KEYSTORE, ..._PASSWORD, NOUGAT_UPLOAD_KEY_ALIAS, ..._PASSWORD).
      - name: AAB Google Play (si la clé d'envoi est présente)
        env:
          NOUGAT_UPLOAD_KEYSTORE: ${{ secrets.NOUGAT_UPLOAD_KEYSTORE }}
          NOUGAT_KEYSTORE_PASSWORD: ${{ secrets.NOUGAT_UPLOAD_KEYSTORE_PASSWORD }}
          NOUGAT_KEY_ALIAS: ${{ secrets.NOUGAT_UPLOAD_KEY_ALIAS }}
          NOUGAT_KEY_PASSWORD: ${{ secrets.NOUGAT_UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -z "$NOUGAT_UPLOAD_KEYSTORE" ]; then
            echo "Pas de clé d'envoi Google Play (NOUGAT_UPLOAD_KEYSTORE) : pas d'AAB."
            exit 0
          fi
          echo "$NOUGAT_UPLOAD_KEYSTORE" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          NOUGAT_KEYSTORE_FILE="$RUNNER_TEMP/upload.jks" ./gradlew :androidApp:bundleRelease --console=plain
      - name: Police chinoise pour les captures (中文)
        if: always()
        run: sudo apt-get install -y --no-install-recommends fonts-noto-cjk || echo "Police chinoise non installée"
      - name: Tests
        if: always()
        run: ./gradlew :shared:desktopTest --console=plain
      - name: Captures d'écran (dossier captures/)
        if: always() && github.event_name == 'push' && github.ref_type == 'branch' && github.ref_name != 'main'
        run: |
          if ls shared/build/captures/*.png >/dev/null 2>&1; then
            mkdir -p captures
            cp shared/build/captures/*.png captures/
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -f captures
            if ! git diff --cached --quiet; then
              git commit -m "Captures d'écran [skip ci]"
              git push origin "HEAD:${GITHUB_REF_NAME}" || echo "Branche déjà avancée : captures non envoyées"
            fi
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nougat-pdf-android
          path: androidApp/build/outputs/apk/release/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nougat-pdf-play
          path: androidApp/build/outputs/bundle/release/*.aab
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: rapports-de-tests
          path: shared/build/reports/tests/

  windows:
    name: Installateur Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # WiX 3.11 (pour le .msi) depuis NuGet, empreinte verifiee : le lien GitHub que Compose
      # utilise par defaut tombe parfois en panne (erreur 504).
      - name: WiX Toolset
        shell: bash
        run: |
          curl -sSfL --retry 4 --retry-delay 5 -o "$RUNNER_TEMP/wix.nupkg" https://www.nuget.org/api/v2/package/wix/3.11.2
          echo "ac2fff0541f87756b530c93ca3a45ff2dfb1ebe392c269901de0c19074bec5d0  $RUNNER_TEMP/wix.nupkg" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/wix"
          unzip -q "$RUNNER_TEMP/wix.nupkg" 'tools/*' -d "$RUNNER_TEMP/wix"
          echo "WIX_PATH=$(cygpath -w "$RUNNER_TEMP/wix/tools")" >> "$GITHUB_ENV"
      - name: Installateur .msi et .exe
        shell: bash
        run: ./gradlew -Pnougat.desktopOnly=true :desktopApp:packageMsi :desktopApp:packageExe --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: nougat-pdf-windows
          path: |
            desktopApp/build/compose/binaries/main/msi/*.msi
            desktopApp/build/compose/binaries/main/exe/*.exe

  release:
    name: Release
    if: github.event_name == 'workflow_dispatch' && inputs.release
    needs: [android, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: fichiers
      - name: Publier la Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: 1.0.${{ github.run_number }}
        run: |
          mkdir sortie
          cp fichiers/nougat-pdf-android/*.apk "sortie/Nougat-PDF-$VERSION.apk"
          # AAB pour Google Play : seulement si la cle d'envoi etait presente.
          cp fichiers/nougat-pdf-play/*.aab "sortie/Nougat-PDF-$VERSION.aab" 2>/dev/null || echo "Pas d'AAB"
          cp fichiers/nougat-pdf-windows/exe/*.exe "sortie/Nougat-PDF-$VERSION.exe" 2>/dev/null || cp fichiers/nougat-pdf-windows/*.exe "sortie/Nougat-PDF-$VERSION.exe"
          cp fichiers/nougat-pdf-windows/msi/*.msi "sortie/Nougat-PDF-$VERSION.msi" 2>/dev/null || cp fichiers/nougat-pdf-windows/*.msi "sortie/Nougat-PDF-$VERSION.msi"
          ls -la sortie
          gh release create "v$VERSION" sortie/* \
            --target "$GITHUB_SHA" \
            --title "Nougat PDF $VERSION" \
            --notes-file .github/release-notes.md
