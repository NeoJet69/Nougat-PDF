name: Construire Nougat PDF

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Tests + APK Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: APK Android
        run: ./gradlew :androidApp:assembleRelease --console=plain
      - name: Tests
        if: always()
        run: ./gradlew :shared:desktopTest --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nougat-pdf-android
          path: androidApp/build/outputs/apk/release/*.apk
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: rapports-de-tests
          path: shared/build/reports/tests/

  windows:
    name: Installateur Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Installateur .msi et .exe
        shell: bash
        run: ./gradlew -Pnougat.desktopOnly=true :desktopApp:packageMsi :desktopApp:packageExe --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: nougat-pdf-windows
          path: |
            desktopApp/build/compose/binaries/main/msi/*.msi
            desktopApp/build/compose/binaries/main/exe/*.exe
