name: Construire Nougat PDF

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Publier une Release (APK + installateurs Windows)"
        type: boolean
        default: false

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Tests + APK Android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Clé de signature Android
        env:
          NOUGAT_KEYSTORE: ${{ secrets.NOUGAT_KEYSTORE }}
        run: |
          if [ -n "$NOUGAT_KEYSTORE" ]; then
            echo "$NOUGAT_KEYSTORE" | base64 --decode > "$RUNNER_TEMP/nougat.jks"
            echo "NOUGAT_KEYSTORE_FILE=$RUNNER_TEMP/nougat.jks" >> "$GITHUB_ENV"
            echo "APK signé avec la clé Nougat."
          else
            echo "::warning::Pas de clé NOUGAT_KEYSTORE : APK signé avec la clé de debug (voir README)."
          fi
      - name: APK Android
        env:
          NOUGAT_KEYSTORE_PASSWORD: ${{ secrets.NOUGAT_KEYSTORE_PASSWORD }}
          NOUGAT_KEY_ALIAS: ${{ secrets.NOUGAT_KEY_ALIAS }}
          NOUGAT_KEY_PASSWORD: ${{ secrets.NOUGAT_KEY_PASSWORD }}
        run: ./gradlew :androidApp:assembleRelease --console=plain
      # Google Play : l'AAB est signe avec la cle d'envoi (upload key), seulement si elle est
      # dans les secrets (NOUGAT_UPLOAD_KEYSTORE, ..._PASSWORD, NOUGAT_UPLOAD_KEY_ALIAS, ..._PASSWORD).
      - name: AAB Google Play (si la clé d'envoi est présente)
        env:
          NOUGAT_UPLOAD_KEYSTORE: ${{ secrets.NOUGAT_UPLOAD_KEYSTORE }}
          NOUGAT_KEYSTORE_PASSWORD: ${{ secrets.NOUGAT_UPLOAD_KEYSTORE_PASSWORD }}
          NOUGAT_KEY_ALIAS: ${{ secrets.NOUGAT_UPLOAD_KEY_ALIAS }}
          NOUGAT_KEY_PASSWORD: ${{ secrets.NOUGAT_UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -z "$NOUGAT_UPLOAD_KEYSTORE" ]; then
            echo "Pas de clé d'envoi Google Play (NOUGAT_UPLOAD_KEYSTORE) : pas d'AAB."
            exit 0
          fi
          echo "$NOUGAT_UPLOAD_KEYSTORE" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          NOUGAT_KEYSTORE_FILE="$RUNNER_TEMP/upload.jks" ./gradlew :androidApp:bundleRelease --console=plain
      - name: Police chinoise pour les captures (中文)
        if: always()
        run: sudo apt-get install -y --no-install-recommends fonts-noto-cjk || echo "Police chinoise non installée"
      - name: Tests
        if: always()
        run: ./gradlew :shared:desktopTest --console=plain
      - name: Captures d'écran (dossier captures/)
        if: always() && github.event_name == 'push' && github.ref_type == 'branch' && github.ref_name != 'main'
        run: |
          if ls shared/build/captures/*.png >/dev/null 2>&1; then
            mkdir -p captures
            cp shared/build/captures/*.png captures/
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -f captures
            if ! git diff --cached --quiet; then
              git commit -m "Captures d'écran [skip ci]"
              git push origin "HEAD:${GITHUB_REF_NAME}" || echo "Branche déjà avancée : captures non envoyées"
            fi
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nougat-pdf-android
          path: androidApp/build/outputs/apk/release/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nougat-pdf-play
          path: androidApp/build/outputs/bundle/release/*.aab
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: rapports-de-tests
          path: shared/build/reports/tests/

  windows:
    name: Installateur Windows
    runs-on: windows-latest
    env:
      # Signature SignPath (certificat SignPath Foundation) : seulement pour une release, et
      # seulement quand le secret existe. Sans lui, les installateurs restent non signes, comme avant.
      SIGNING: ${{ github.event_name == 'workflow_dispatch' && inputs.release && secrets.SIGNPATH_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # WiX 3.11 (pour le .msi) depuis NuGet, empreinte verifiee : le lien GitHub que Compose
      # utilise par defaut tombe parfois en panne (erreur 504).
      - name: WiX Toolset
        shell: bash
        run: |
          curl -sSfL --retry 4 --retry-delay 5 -o "$RUNNER_TEMP/wix.nupkg" https://www.nuget.org/api/v2/package/wix/3.11.2
          echo "ac2fff0541f87756b530c93ca3a45ff2dfb1ebe392c269901de0c19074bec5d0  $RUNNER_TEMP/wix.nupkg" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/wix"
          unzip -q "$RUNNER_TEMP/wix.nupkg" 'tools/*' -d "$RUNNER_TEMP/wix"
          echo "WIX_PATH=$(cygpath -w "$RUNNER_TEMP/wix/tools")" >> "$GITHUB_ENV"
          # jpackage cherche aussi candle.exe et light.exe dans le PATH.
          echo "$RUNNER_TEMP/wix/tools" >> "$GITHUB_PATH"

      # 1. Le dossier de l'application (avec « Nougat PDF.exe »), sans installateur.
      - name: Application (dossier)
        shell: bash
        run: |
          ./gradlew -Pnougat.desktopOnly=true :desktopApp:createDistributable --console=plain
          mkdir -p app-unsigned
          cp -r "desktopApp/build/compose/binaries/main/app/Nougat PDF" app-unsigned/

      # 2. Signer le lanceur « Nougat PDF.exe » (release avec secret SignPath seulement).
      - name: Envoyer le dossier a SignPath
        if: env.SIGNING == 'true'
        id: upload-app
        uses: actions/upload-artifact@v4
        with:
          name: app-unsigned
          path: app-unsigned/
      - name: Signer le lanceur (SignPath)
        if: env.SIGNING == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: nougat-pdf
          signing-policy-slug: release-signing
          artifact-configuration-slug: app-image
          github-artifact-id: ${{ steps.upload-app.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: app-signed
      - name: Dossier a empaqueter
        shell: bash
        run: |
          if [ "$SIGNING" = "true" ]; then echo "APP_DIR=app-signed" >> "$GITHUB_ENV"; else echo "APP_DIR=app-unsigned" >> "$GITHUB_ENV"; fi

      # 3. Les installateurs .msi et .exe, faits par jpackage a partir de ce dossier (deja signe en release).
      - name: Installateurs .msi et .exe
        shell: bash
        run: |
          VERSION="1.0.$(grep '^nougat.versionCode=' gradle.properties | cut -d= -f2)"
          printf 'mime-type=application/pdf\nextension=pdf\ndescription=Document PDF\nicon=%s\n' "$(cygpath -m "$PWD/desktopApp/icons/nougat.ico")" > pdf.properties
          mkdir -p installers
          for TYPE in msi exe; do
            "$JAVA_HOME/bin/jpackage" --type "$TYPE" --app-image "$APP_DIR/Nougat PDF" \
              --name "Nougat PDF" --app-version "$VERSION" \
              --vendor "NeoJet, Nougat et Caramel" --description "Lecteur et editeur de PDF, gratuit et sans pub" \
              --win-menu --win-menu-group "Nougat PDF" --win-shortcut --win-per-user-install --win-dir-chooser \
              --win-upgrade-uuid 5b8a3c1e-6f2d-4b7a-9e41-0c7d2a9f1b63 \
              --file-associations pdf.properties --dest installers
          done
          ls -la installers

      # 4. Signer les deux installateurs (release avec secret SignPath seulement).
      - name: Envoyer les installateurs a SignPath
        if: env.SIGNING == 'true'
        id: upload-installers
        uses: actions/upload-artifact@v4
        with:
          name: installers-unsigned
          path: installers/
      - name: Signer les installateurs (SignPath)
        if: env.SIGNING == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: nougat-pdf
          signing-policy-slug: release-signing
          artifact-configuration-slug: installers
          github-artifact-id: ${{ steps.upload-installers.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: installers-signed
      - name: Installateurs finaux
        shell: bash
        run: |
          mkdir -p final
          if [ "$SIGNING" = "true" ]; then cp installers-signed/*.msi installers-signed/*.exe final/; else cp installers/*.msi installers/*.exe final/; fi
          ls -la final

      - uses: actions/upload-artifact@v4
        with:
          name: nougat-pdf-windows
          path: |
            final/*.msi
            final/*.exe

  release:
    name: Release
    if: github.event_name == 'workflow_dispatch' && inputs.release
    needs: [android, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: fichiers
      - name: Publier la Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="1.0.$(grep '^nougat.versionCode=' gradle.properties | cut -d= -f2)"
          if gh release view "v$VERSION" >/dev/null 2>&1; then echo "La release v$VERSION existe deja : augmentez nougat.versionCode dans gradle.properties."; exit 1; fi
          mkdir sortie
          cp fichiers/nougat-pdf-android/*.apk "sortie/Nougat-PDF-$VERSION.apk"
          # AAB pour Google Play : seulement si la cle d'envoi etait presente.
          cp fichiers/nougat-pdf-play/*.aab "sortie/Nougat-PDF-$VERSION.aab" 2>/dev/null || echo "Pas d'AAB"
          cp fichiers/nougat-pdf-windows/exe/*.exe "sortie/Nougat-PDF-$VERSION.exe" 2>/dev/null || cp fichiers/nougat-pdf-windows/*.exe "sortie/Nougat-PDF-$VERSION.exe"
          cp fichiers/nougat-pdf-windows/msi/*.msi "sortie/Nougat-PDF-$VERSION.msi" 2>/dev/null || cp fichiers/nougat-pdf-windows/*.msi "sortie/Nougat-PDF-$VERSION.msi"
          ls -la sortie
          gh release create "v$VERSION" sortie/* \
            --target "$GITHUB_SHA" \
            --title "Nougat PDF $VERSION" \
            --notes-file .github/release-notes.md
